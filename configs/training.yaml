# 机器学习训练配置
training:
  model_dir: "models"
  datasets_dir: "datasets"
  daisee_root: "D:/数据集/DAiSEE/DAiSEE"
  test_size: 0.2
  random_state: 42
  target: "attention_score"

xgboost:
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8

lstm:
  hidden_size: 64
  num_layers: 2
  seq_len: 60
  dropout: 0.2
  batch_size: 32
  epochs: 100
  learning_rate: 0.001

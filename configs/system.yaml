# 系统全局配置
system:
  name: "Student-EarlyWarning-System"
  version: "0.1.0"
  timezone: "Asia/Shanghai"

server:
  host: "0.0.0.0"
  port: 5000
  debug: false
  threaded: true

defaults:
  student_no: "S00001"
  student_name: "测试学生"
  class_name: "计科2301"
  major: "计算机科学与技术"
  course_name: "课堂状态测试"
  teacher_name: "测试教师"
  classroom: "教学楼A101"

prediction:
  enabled: true
  model_name: "xgboost"
  model_version: "engagement-v1"
  window_seconds: 10
  min_records: 10

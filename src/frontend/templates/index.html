<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生学业状态分析与预警系统</title>
    <!-- ECharts 本地资源（离线/内网可用） -->
    <script src="/static/js/echarts.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topbar">
        <h1>学生学业状态分析与预警系统</h1>
        <span id="health-status" class="badge">检测中...</span>
    </header>
    <nav class="main-nav" aria-label="主导航">
        <a class="active" href="/">实时看板</a>
        <a href="/playback">视频回放</a>
        <a href="/model">模型说明</a>
    </nav>

    <main class="container">
        <section class="card live-card">
            <h2>实时画面</h2>
            <div id="live-placeholder" class="live-placeholder">
                <span class="pulse-dot"></span>
                等待画面
            </div>
        </section>

        <section class="card metrics-card">
            <h2>实时指标</h2>
            <div class="metrics-grid">
                <div class="metric"><label>FPS</label><span id="m-fps">--</span></div>
                <div class="metric"><label>EAR</label><span id="m-ear">--</span></div>
                <div class="metric"><label>PERCLOS</label><span id="m-perclos">--</span></div>
                <div class="metric"><label>Pitch</label><span id="m-pitch">--</span></div>
                <div class="metric"><label>Yaw</label><span id="m-yaw">--</span></div>
                <div class="metric"><label>Roll</label><span id="m-roll">--</span></div>
                <div class="metric"><label>疲劳</label><span id="m-fatigue">--</span></div>
                <div class="metric"><label>参与度</label><span id="m-engagement">--</span></div>
            </div>
        </section>

        <section class="card model-card">
            <h2>模型参与度</h2>
            <div class="model-summary">
                <div><label>等级</label><strong id="model-level">模型未就绪</strong></div>
                <div><label>置信度</label><span id="model-confidence">--</span></div>
                <div><label>模型版本</label><span id="model-version">--</span></div>
            </div>
            <div id="model-probabilities" class="probability-list"></div>
        </section>

        <section class="card warning-card">
            <h2>风险预警</h2>
            <table id="warning-table">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>类型</th>
                        <th>等级</th>
                        <th>原因</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="4">暂无预警</td></tr>
                </tbody>
            </table>
        </section>

        <section class="card">
            <h2>专注度趋势</h2>
            <div id="attention-chart" class="chart"></div>
        </section>

        <section class="card">
            <h2>疲劳度趋势</h2>
            <div id="fatigue-chart" class="chart"></div>
        </section>

        <section class="card">
            <h2>数据库最新记录</h2>
            <table id="state-table">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>EAR</th>
                        <th>PERCLOS</th>
                        <th>Pitch</th>
                        <th>Yaw</th>
                        <th>Roll</th>
                        <th>专注度</th>
                        <th>疲劳度</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="8">暂无数据</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
